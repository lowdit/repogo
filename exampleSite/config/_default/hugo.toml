baseURL = ""
title = "Lowdit Press"
defaultContentLanguage = "fr"

# Modules résolus sur les dépôts locaux par bin/hugo.work (aussi pour hugo server).
# La prod (config/production) garde les versions épinglées par go.mod.
# Repogo d'abord : ses gabarits écran (TOC + corps d'article) priment,
# Minigo fournit la coque et le reste des layouts.
theme = ["github.com/lowdit/repogo", "github.com/lowdit/lowdit-kit"]

[outputs]
  home = ["HTML"]
  section = ["HTML"]
  page = ["HTML", "print", "abstract"]

[params.lowdit]
  logo = "logos/repogo.png"
  faviconDir = "favicons/repogo"
  socialImage = "/assets/social/twittercard-default.png"
  siteProfile = "publisher"
  view = "publisher"
  homeEyebrow = "Repogo · édition"
  featuredBook = "/reports/etude-marche-editeurs-libres/"
  pinned = ["/reports/ca-2026-03-12-collectif-horizons/", "/reports/ag-2026-06-28-collectif-horizons/", "/reports/appel-offre-refonte-portail-services/"]
  showPrintLink = true

[[menus.main]]
  name = "Accueil"
  url = "/"
  weight = 1
[[menus.main]]
  name = "Installation"
  url = "/installation/"
  weight = 2
[[menus.main]]
  name = "Catalogue"
  url = "/reports/"
  weight = 3

[markup.goldmark.renderer]
  unsafe = true

[module]
  # Espace de travail local : lowdit-kit et les modules du disque.
  workspace = "../../bin/hugo.work"
