baseURL = ""
title = "Lowdit Press"
defaultContentLanguage = "fr"

[module]
  [[module.imports]]
    path = "github.com/lowdit/minigo"
  [[module.imports]]
    path = "github.com/lowdit/repogo"

# Coque Minigo d’abord (layouts écran), Repogo pour print — voir lowdit-brand/docs/UNIVERS-COMPOSITION-SITES.md
theme = ["minigo", "repogo"]

[outputs]
  home = ["HTML"]
  section = ["HTML"]
  page = ["HTML", "print", "abstract"]

[params.lowdit]
  siteProfile = "publisher"
  view = "publisher"
  homeEyebrow = "Repogo · édition"
  featuredBook = "/reports/la-mission-publique/"
  showPrintLink = true

[[menus.main]]
  name = "Accueil"
  url = "/"
  weight = 1
[[menus.main]]
  name = "Produit"
  url = "/product/"
  weight = 2
[[menus.main]]
  name = "Catalogue"
  url = "/reports/"
  weight = 3

[markup.goldmark.renderer]
  unsafe = true
