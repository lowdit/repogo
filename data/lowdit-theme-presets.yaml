# Presets params.lowdit.theme et surface — consommés par theme-vars.html
# Enum fermées : lowtech-dev-method/schemas/lowdit-hugo-profile.schema.json

presets:
  default: {}
  thinktank-cream:
    description: Hub / observatoire — cartes blanches sur crème, accent Repogo
    vars:
      "--lowdit-charte-accent": "var(--lowdit-repogo)"
      "--lowdit-surface-card": "var(--lowdit-color-white, #fff)"
  publisher-day:
    description: Édition / books — Repogo, liens nuit sur fond crème
    vars:
      "--lowdit-charte-accent": "var(--lowdit-repogo)"
      "--lowdit-color-link": "var(--lowdit-color-night, #0f1728)"
  pedago-publisher:
    description: Parcours pédago + coque publisher — turquoise, colonne lecture
    vars:
      "--lowdit-charte-accent": "var(--lowdit-turquoise)"
      "--lowdit-prose-measure": "42rem"

surfaces:
  cream:
    "--lowdit-surface-page": "var(--lowdit-color-cream, #f1efeb)"
  white:
    "--lowdit-surface-page": "var(--lowdit-color-white, #fff)"
  night:
    "--lowdit-surface-page": "var(--lowdit-color-night, #0f1728)"

homeLayouts:
  lowdit-home: Accueil DS (layouts/index.html, sections)
  hub-shell: Hub à slots (partial hub-shell)
  pedago-rail: Accueil délégué au thème pedago