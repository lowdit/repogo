[module]
  [module.hugoVersion]
    extended = true
    min = "0.128.0"

[markup.goldmark.renderer]
  unsafe = true

[outputs]
  page = ["HTML", "print", "abstract"]

[outputFormats.print]
  baseName = "print"
  mediaType = "text/html"
  notAlternative = false
  permalinkable = true
  isHTML = true

[outputFormats.abstract]
  baseName = "abstract"
  mediaType = "text/html"
  notAlternative = false
  permalinkable = true
  isHTML = true

# Modèle servi par repogo : accueil éditorial et feuille du lecteur/catalogue.
[params.lowdit.models.publisher]
  home = "home/publisher.html"
  sheet = "publisher"
