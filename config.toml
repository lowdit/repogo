[module]
  [module.hugoVersion]
    extended = true
    min = "0.128.0"

[markup.goldmark.renderer]
  unsafe = true

[outputs]
  page = ["HTML", "print", "abstract"]

[outputFormats.print]
  baseName = "print"
  mediaType = "text/html"
  notAlternative = false
  permalinkable = true
  isHTML = true

[outputFormats.abstract]
  baseName = "abstract"
  mediaType = "text/html"
  notAlternative = false
  permalinkable = true
  isHTML = true
